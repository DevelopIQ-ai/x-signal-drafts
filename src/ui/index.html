<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>x-signal-drafts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --x-border: rgb(239, 243, 244);
        --x-text: rgb(15, 20, 25);
        --x-muted: rgb(83, 100, 113);
        --x-blue: rgb(29, 155, 240);
        --x-blue-hover: rgba(29, 155, 240, 0.1);
        --x-hover: rgba(15, 20, 25, 0.03);
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--x-text);
        background: #fff;
      }
      .x-border { border-color: var(--x-border); }
      .x-text { color: var(--x-text); }
      .x-muted { color: var(--x-muted); }
      .x-blue { color: var(--x-blue); }
      .hover-x:hover { background: var(--x-hover); }
      .post-link:hover { text-decoration: underline; }
      .nav-item:hover { background: var(--x-hover); }
      .nav-item.active { font-weight: 700; }
      .nav-btn { color: var(--x-text); }
      .nav-btn svg { stroke: currentColor; }
    </style>
  </head>
  <body class="min-h-screen">
    <div class="mx-auto flex max-w-[1265px] justify-center">
      <!-- Left sidebar -->
      <header class="sticky top-0 flex h-screen w-[68px] flex-col justify-between border-r x-border px-2 py-2 sm:w-[88px] lg:w-[275px] lg:px-4">
        <div class="flex flex-col items-center lg:items-start">
          <a href="/" class="flex h-[52px] w-[52px] items-center justify-center rounded-full hover:bg-gray-100 lg:justify-start">
            <svg viewBox="0 0 24 24" class="h-7 w-7" aria-hidden="true">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" fill="currentColor"/>
            </svg>
          </a>

          <!-- Profile card on top (desktop) -->
          <div id="profile-card" class="mt-2 hidden w-full rounded-full border x-border px-4 py-3 lg:flex lg:items-center lg:gap-3 lg:rounded-2xl">
            <div id="profile-avatar" class="h-10 w-10 flex-shrink-0 rounded-full bg-gradient-to-br from-gray-300 to-gray-500 text-sm font-bold text-white flex items-center justify-center">?</div>
            <div class="hidden min-w-0 flex-1 lg:block">
              <div id="profile-name" class="truncate text-[15px] font-bold leading-tight">Profile</div>
              <div id="profile-handle" class="truncate text-[15px] text-gray-500">@handle</div>
            </div>
          </div>

          <nav class="mt-2 flex flex-col items-center gap-1 lg:items-start lg:gap-0">
            <a href="/" class="nav-item active flex h-[50px] w-[50px] items-center justify-center gap-4 rounded-full text-xl lg:w-auto lg:justify-start lg:px-4">
              <svg viewBox="0 0 24 24" class="h-[26px] w-[26px]" fill="currentColor"><path d="M12 1.696.622 8.807l1.06 1.696L3 9.679V19.5A2.5 2.5 0 0 0 5.5 22h13a2.5 2.5 0 0 0 2.5-2.5V9.679l1.318.824 1.06-1.696L12 1.696zM12 16.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
              <span class="hidden lg:inline">Home</span>
            </a>
            <button class="nav-item flex h-[50px] w-[50px] cursor-pointer items-center justify-center gap-4 rounded-full border-0 bg-transparent text-xl lg:w-auto lg:justify-start lg:px-4" disabled>
              <svg viewBox="0 0 24 24" class="h-[26px] w-[26px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m21 21-4.34-4.34"/><circle cx="10.5" cy="10.5" r="7.5"/></svg>
              <span class="hidden lg:inline">Explore</span>
            </button>
            <button class="nav-item flex h-[50px] w-[50px] cursor-pointer items-center justify-center gap-4 rounded-full border-0 bg-transparent text-xl lg:w-auto lg:justify-start lg:px-4" disabled>
              <svg viewBox="0 0 24 24" class="h-[26px] w-[26px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span class="hidden lg:inline">Profile</span>
            </button>
            <button class="nav-item flex h-[50px] w-[50px] cursor-pointer items-center justify-center gap-4 rounded-full border-0 bg-transparent text-xl lg:w-auto lg:justify-start lg:px-4" disabled>
              <svg viewBox="0 0 24 24" class="h-[26px] w-[26px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              <span class="hidden lg:inline">Settings</span>
            </button>
          </nav>
          <button id="scan" class="mt-4 flex h-[52px] w-[52px] items-center justify-center rounded-full bg-black font-bold text-white shadow-md hover:bg-gray-800 lg:w-full lg:rounded-full lg:px-8">
            <span class="hidden lg:inline">Scan now</span>
            <svg class="h-6 w-6 lg:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9 9 9 0 0 1 9 9z"/><path d="M9 12h6"/><path d="M12 9v6"/></svg>
          </button>
        </div>
      </header>

      <!-- Main feed -->
      <main class="flex min-w-0 flex-1 flex-col border-r x-border max-w-[600px]">
        <!-- Mobile top bar with profile -->
        <div class="sticky top-0 z-20 flex items-center justify-between border-b x-border bg-white/90 px-4 py-3 backdrop-blur lg:hidden">
          <div id="mobile-avatar" class="h-8 w-8 rounded-full bg-gradient-to-br from-gray-300 to-gray-500 text-xs font-bold text-white flex items-center justify-center">?</div>
          <h1 class="text-lg font-bold">Home</h1>
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor"><path d="M3 4.5C3 3.12 4.12 2 5.5 2h13C19.88 2 21 3.12 21 4.5v15c0 1.38-1.12 2.5-2.5 2.5h-13C4.12 22 3 20.88 3 19.5v-15z"/></svg>
        </div>

        <!-- Desktop header -->
        <div class="sticky top-0 z-20 hidden cursor-pointer border-b x-border bg-white/90 px-4 py-3 backdrop-blur lg:block" onclick="window.scrollTo({top:0,behavior:'smooth'})">
          <h1 class="text-xl font-bold">Home</h1>
        </div>

        <!-- Tabs -->
        <div class="flex border-b x-border">
          <button class="flex flex-1 items-center justify-center py-4 font-bold hover:bg-gray-50 relative">
            For you
            <span class="absolute bottom-0 h-1 w-14 rounded-full bg-black"></span>
          </button>
          <button class="flex flex-1 items-center justify-center py-4 font-medium text-gray-500 hover:bg-gray-50" disabled>Following</button>
        </div>

        <!-- Compose box (placeholder) -->
        <div class="hidden border-b x-border px-4 py-3 lg:flex lg:gap-3">
          <div class="h-10 w-10 flex-shrink-0 rounded-full bg-gradient-to-br from-gray-300 to-gray-500 text-xs font-bold text-white flex items-center justify-center" id="compose-avatar">?</div>
          <div class="flex-1">
            <input type="text" disabled placeholder="What would your targets say?" class="w-full bg-transparent text-xl outline-none placeholder:text-gray-400" />
            <div class="mt-3 flex items-center justify-end">
              <button disabled class="rounded-full bg-black px-5 py-1.5 font-bold text-white opacity-50">Post</button>
            </div>
          </div>
        </div>

        <!-- Feed -->
        <div id="feed" class="min-h-[50vh]">
          <div class="p-8 text-center text-gray-500">Loading feed…</div>
        </div>
      </main>

      <!-- Right column -->
      <aside class="sticky top-0 hidden h-screen w-[350px] flex-col gap-4 overflow-y-auto px-8 py-2 lg:flex">
        <!-- Search -->
        <div class="sticky top-0 z-10 bg-white pb-2 pt-1">
          <div class="flex items-center gap-3 rounded-full bg-gray-100 px-4 py-2.5">
            <svg viewBox="0 0 24 24" class="h-4 w-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.34-4.34"/></svg>
            <input type="text" placeholder="Search" disabled class="w-full bg-transparent text-sm outline-none" />
          </div>
        </div>

        <!-- Targets card -->
        <div class="rounded-2xl bg-gray-50 p-4">
          <h2 class="mb-3 text-xl font-extrabold">Your targets</h2>
          <div id="targets-list" class="space-y-3">
            <p class="text-sm text-gray-500">Loading…</p>
          </div>
        </div>

        <!-- What's happening / filters -->
        <div class="rounded-2xl bg-gray-50 p-4">
          <h2 class="mb-3 text-xl font-extrabold">Filters</h2>
          <div class="space-y-3 text-sm text-gray-500">
            <p>Only original posts from configured accounts.</p>
            <p>Low-signal posts and engagement bait are filtered out.</p>
          </div>
        </div>

        <footer class="px-4 text-[13px] text-gray-400">
          <p>&copy; x-signal-drafts · local feed</p>
        </footer>
      </aside>
    </div>

    <script>
      async function api(path, options) {
        const response = await fetch(path, options);
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || `${response.status} ${path}`);
        return body;
      }

      function initials(value) {
        return (value || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((s) => s[0]?.toUpperCase() || '').join('') || '?';
      }

      function avatarGradient(value) {
        let hash = 0;
        for (let i = 0; i < (value || '').length; i++) hash = (hash * 31 + value.charCodeAt(i)) >>> 0;
        const h = hash % 360;
        return `linear-gradient(135deg, hsl(${h} 70% 60%) 0%, hsl(${(h + 40) % 360} 60% 45%) 100%)`;
      }

      function relativeDate(iso) {
        const seconds = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
        if (seconds < 60) return `${seconds}s`;
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h`;
        const days = Math.floor(hours / 24);
        return `${days}d`;
      }

      function formatCount(n) {
        if (n === null || n === undefined) return '';
        if (n >= 1_000_000) return `${(n / 1_000_000).toFixed(1).replace(/\.0$/, '')}M`;
        if (n >= 1_000) return `${(n / 1_000).toFixed(1).replace(/\.0$/, '')}K`;
        return String(n);
      }

      async function loadProfile(config) {
        const handle = config.targets[0] || 'you';
        const name = config.voice?.bio || 'Your feed';
        const avatars = document.querySelectorAll('[id$="-avatar"], #profile-avatar');
        avatars.forEach((el) => {
          el.textContent = initials(name);
          el.style.background = avatarGradient(name);
        });
        const profileName = document.getElementById('profile-name');
        const profileHandle = document.getElementById('profile-handle');
        if (profileName) profileName.textContent = name;
        if (profileHandle) profileHandle.textContent = `@${handle}`;
      }

      async function loadTargets(config) {
        const list = document.getElementById('targets-list');
        if (!config.targets.length) {
          list.innerHTML = '<p class="text-sm text-gray-500">No targets configured yet.</p>';
          return;
        }
        list.replaceChildren(...config.targets.map((handle) => {
          const row = document.createElement('div');
          row.className = 'flex items-center gap-3';
          row.innerHTML = `
            <div class="h-10 w-10 rounded-full text-sm font-bold text-white flex items-center justify-center" style="background:${avatarGradient(handle)}">${initials(handle)}</div>
            <div class="min-w-0 flex-1">
              <div class="truncate text-[15px] font-bold leading-tight">@${handle}</div>
              <div class="truncate text-[13px] text-gray-500">Monitored account</div>
            </div>
          `;
          return row;
        }));
      }

      async function renderFeed() {
        const container = document.getElementById('feed');
        try {
          const [{ alerts }, config] = await Promise.all([api('/api/feed?limit=50'), api('/api/config')]);
          if (!alerts.length) {
            container.innerHTML = `
              <div class="flex flex-col items-center justify-center p-12 text-center">
                <div class="mb-4 text-4xl">📡</div>
                <h3 class="text-xl font-bold">No signals yet</h3>
                <p class="mt-2 max-w-xs text-gray-500">Run a scan to fetch the latest posts from your targets.</p>
                <button id="empty-scan" class="mt-4 rounded-full bg-black px-5 py-2 font-bold text-white hover:bg-gray-800">Scan now</button>
              </div>
            `;
            document.getElementById('empty-scan')?.addEventListener('click', triggerScan);
            return;
          }
          container.replaceChildren(...alerts.map((alert, index) => buildPost(alert, index === alerts.length - 1)));
        } catch (error) {
          container.innerHTML = `<div class="p-8 text-center text-red-600">Could not load feed: ${error.message}</div>`;
        }
      }

      function buildPost(alert, isLast) {
        const { tweet } = alert;
        const author = tweet.author || {};
        const metrics = tweet.metrics || {};
        const replyCount = metrics.reply_count ?? metrics.replies ?? null;
        const retweetCount = metrics.retweet_count ?? metrics.retweets ?? null;
        const likeCount = metrics.like_count ?? metrics.likes ?? null;
        const viewCount = metrics.impression_count ?? metrics.views ?? null;
        const name = author.name || author.username || 'Unknown';

        const article = document.createElement('article');
        article.className = `hover-x cursor-pointer border-b x-border transition-colors ${isLast ? '' : ''}`;
        article.innerHTML = `
          <div class="grid grid-cols-[40px_1fr] gap-3 px-4 py-3 sm:grid-cols-[48px_1fr] sm:gap-4">
            <a href="https://x.com/${author.username}" target="_blank" rel="noopener" class="flex-shrink-0" data-no-card-open>
              <div class="h-10 w-10 rounded-full text-sm font-bold text-white flex items-center justify-center sm:h-12 sm:w-12 sm:text-base" style="background:${avatarGradient(name)}">${initials(name)}</div>
            </a>
            <div class="min-w-0">
              <div class="flex items-start justify-between gap-2">
                <div class="flex min-w-0 items-center gap-1 text-[15px]">
                  <a href="https://x.com/${author.username}" target="_blank" rel="noopener" class="post-link truncate font-bold" data-no-card-open>${name}</a>
                  <span class="truncate text-gray-500">@${author.username}</span>
                  ${tweet.createdAt ? `<span class="text-gray-500">·</span><time class="text-gray-500 flex-shrink-0" datetime="${tweet.createdAt}">${relativeDate(tweet.createdAt)}</time>` : ''}
                </div>
                <a href="${tweet.url}" target="_blank" rel="noopener" class="ml-2 text-gray-500 hover:text-black flex-shrink-0" data-no-card-open aria-label="Open post on X">
                  <svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </a>
              </div>
              <div class="mt-0.5 whitespace-pre-wrap text-[15px] leading-normal text-[#0f1419]">${escapeHtml(tweet.text)}</div>
              ${tweet.mediaUrls?.length ? buildMedia(tweet.mediaUrls) : ''}
              <div class="mt-3 flex max-w-md items-center justify-between text-[13px] text-gray-500">
                ${actionIcon('reply', replyCount)}
                ${actionIcon('retweet', retweetCount)}
                ${actionIcon('like', likeCount)}
                ${actionIcon('view', viewCount)}
              </div>
            </div>
          </div>
        `;
        article.addEventListener('click', (event) => {
          if (event.target.closest('[data-no-card-open]')) return;
          if (tweet.url) window.open(tweet.url, '_blank', 'noopener,noreferrer');
        });
        return article;
      }

      function actionIcon(kind, count) {
        const value = formatCount(count);
        const icons = {
          reply: { color: 'group-hover:text-blue-500 group-hover:bg-blue-50', svg: '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 15.2 4.3a8.5 8.5 0 0 1 5.8 7.2z"/></svg>' },
          retweet: { color: 'group-hover:text-green-500 group-hover:bg-green-50', svg: '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 5h15a2 2 0 0 1 2 2v10"/><path d="M7 23l-4-4 4-4"/><path d="M21 19H6a2 2 0 0 1-2-2V7"/></svg>' },
          like: { color: 'group-hover:text-red-500 group-hover:bg-red-50', svg: '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor"><path d="M12 21.638h-.014C9.403 21.59 1.95 14.856 1.95 8.478c0-3.064 2.525-5.754 5.403-5.754 2.29 0 3.83 1.58 4.646 2.73.814-1.148 2.354-2.73 4.645-2.73 2.88 0 5.404 2.69 5.404 5.755 0 6.376-7.454 13.11-10.037 13.157H12z"/></svg>' },
          view: { color: 'group-hover:text-blue-500 group-hover:bg-blue-50', svg: '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>' },
        };
        const icon = icons[kind];
        return `
          <div class="group flex items-center gap-1 transition-colors ${value ? '' : 'opacity-50'}">
            <div class="flex h-8 w-8 items-center justify-center rounded-full ${icon.color}">
              ${icon.svg}
            </div>
            <span class="min-w-[1.5rem]">${value || ''}</span>
          </div>
        `;
      }

      function buildMedia(urls) {
        const columns = urls.length === 1 ? 'grid-cols-1' : 'grid-cols-2';
        return `
          <div class="mt-3 grid ${columns} gap-0.5 overflow-hidden rounded-2xl border x-border">
            ${urls.map((url) => `<img src="${url}" alt="" loading="lazy" class="h-[205px] w-full object-cover" onerror="this.style.display='none'" />`).join('')}
          </div>
        `;
      }

      function escapeHtml(text) {
        return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      async function triggerScan() {
        const btn = document.getElementById('scan') || document.getElementById('empty-scan');
        if (btn) { btn.disabled = true; btn.classList.add('opacity-50'); }
        try {
          await api('/api/scan', { method: 'POST' });
          await new Promise((resolve) => setTimeout(resolve, 1500));
          await renderFeed();
        } catch (error) {
          alert(error.message);
        } finally {
          if (btn) { btn.disabled = false; btn.classList.remove('opacity-50'); }
        }
      }

      async function init() {
        try {
          const config = await api('/api/config');
          loadProfile(config);
          loadTargets(config);
        } catch (error) {
          document.getElementById('targets-list').innerHTML = `<p class="text-sm text-red-600">Config unavailable: ${error.message}</p>`;
        }
        renderFeed();
        setInterval(renderFeed, 30000);
      }

      document.getElementById('scan').addEventListener('click', triggerScan);
      init();
    </script>
  </body>
</html>
