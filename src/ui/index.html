<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>x-signal-drafts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Inter', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
  </head>
  <body class="min-h-screen bg-[#fafafa] text-[#0a0a0a]">
    <header class="sticky top-0 z-10 border-b border-neutral-200 bg-white/90 px-6 py-4 backdrop-blur">
      <div class="mx-auto flex max-w-3xl items-center justify-between">
        <h1 class="text-lg font-semibold tracking-tight">x-signal-drafts</h1>
        <div class="flex items-center gap-3 text-sm text-neutral-500">
          <span id="targets">loading…</span>
          <button id="scan" class="rounded-lg border border-neutral-200 bg-white px-3 py-1.5 text-sm font-medium hover:border-neutral-400 hover:text-black">scan now</button>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-3xl px-6 py-8">
      <p class="mb-6 text-sm text-neutral-500">High-signal posts from the accounts you monitor. Everything stays on your machine.</p>
      <div id="feed" class="space-y-4">
        <div class="rounded-xl border border-neutral-200 bg-white p-6 text-center text-sm text-neutral-500">Loading feed…</div>
      </div>
    </main>

    <script>
      async function api(path, options) {
        const response = await fetch(path, options);
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || `${response.status} ${path}`);
        return body;
      }

      function timeAgo(iso) {
        const seconds = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
        if (seconds < 60) return 'just now';
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m ago`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h ago`;
        return `${Math.floor(hours / 24)}d ago`;
      }

      async function renderTargets() {
        try {
          const { targets } = await api('/api/config');
          document.getElementById('targets').textContent = targets.length ? `@${targets.join(', @')}` : 'no targets configured';
        } catch (error) {
          document.getElementById('targets').textContent = 'config unavailable';
        }
      }

      async function renderFeed() {
        const container = document.getElementById('feed');
        try {
          const { alerts } = await api('/api/feed?limit=50');
          if (!alerts.length) {
            container.innerHTML = '<div class="rounded-xl border border-neutral-200 bg-white p-6 text-center text-sm text-neutral-500">No alerts yet. Run a scan or wait for the daemon to pick something up.</div>';
            return;
          }
          container.replaceChildren(...alerts.map((alert) => {
            const { tweet, draft } = alert;
            const card = document.createElement('div');
            card.className = 'rounded-xl border border-neutral-200 bg-white p-5 shadow-sm';
            card.innerHTML = `
              <div class="flex items-start justify-between gap-4">
                <div class="min-w-0 flex-1">
                  <a href="${tweet.url}" target="_blank" rel="noopener" class="font-semibold text-black hover:underline">@${tweet.author.username}</a>
                  <span class="ml-2 text-xs text-neutral-400">${timeAgo(tweet.createdAt)}</span>
                  <p class="mt-2 whitespace-pre-wrap text-sm leading-relaxed text-neutral-800">${tweet.text}</p>
                </div>
              </div>
              ${draft?.shouldReply ? `
                <div class="mt-4 rounded-lg bg-[#f6f6f6] p-4">
                  <p class="text-xs font-medium uppercase tracking-wide text-neutral-500">Suggested reply</p>
                  <p class="mt-1 text-sm text-neutral-900">${draft.draft}</p>
                  ${draft.rationale ? `<p class="mt-2 text-xs text-neutral-500">${draft.rationale}</p>` : ''}
                </div>
              ` : ''}
            `;
            return card;
          }));
        } catch (error) {
          container.innerHTML = `<div class="rounded-xl border border-red-200 bg-red-50 p-6 text-center text-sm text-red-700">Could not load feed: ${error.message}</div>`;
        }
      }

      document.getElementById('scan').addEventListener('click', async () => {
        const button = document.getElementById('scan');
        button.disabled = true;
        button.textContent = 'scanning…';
        try {
          await api('/api/scan', { method: 'POST' });
          await new Promise((resolve) => setTimeout(resolve, 2000));
          await renderFeed();
        } catch (error) {
          alert(error.message);
        } finally {
          button.disabled = false;
          button.textContent = 'scan now';
        }
      });

      renderTargets();
      renderFeed();
      setInterval(renderFeed, 30000);
    </script>
  </body>
</html>
